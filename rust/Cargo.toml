[package]
name = "sassy-c"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
publish = false

[lib]
name = "sassy_c"
crate-type = ["staticlib", "rlib"]

[dependencies]
sassy = { version = "=0.2.1", default-features = false }

[features]
default = ["portable"]
portable = ["sassy/scalar"]

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"

[workspace]
