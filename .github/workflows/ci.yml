name: C API v2 and Rust C library
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Fetch pinned v2 SDK
        run: make sdk
      - name: Architecture checks
        run: python3 test/check_contract.py
      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Build C adapter and run the real C ABI test
        run: make test
      - name: Check loadable entrypoint and absence of DuckDB linkage
        shell: bash
        run: |
          nm -D build/ducksassy.so | grep ' T ducksassy_init_c_api_v2$'
          if nm -D --undefined-only build/ducksassy.so | grep -E ' U duckdb_'; then exit 1; fi
          if ldd build/ducksassy.so | grep -i duckdb; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ducksassy-linux-amd64
          path: |
            build/ducksassy.duckdb_extension
            rust/target/release/libsassy_c.a
            include/sassy_c.h
            rust/Cargo.lock
            sql/ducksassy.sql
  sql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ducksassy-linux-amd64
          path: artifacts
      - uses: actions/checkout@v4
        with:
          repository: duckdb/duckdb
          ref: fece4143738e2b1d05a851d5c5dc036838aff8ec
          path: .deps/duckdb
      - name: Build matching v2-preview DuckDB host
        run: |
          cmake -S .deps/duckdb -B .deps/duckdb/build/release -DCMAKE_BUILD_TYPE=Release -DBUILD_UNITTESTS=OFF
          cmake --build .deps/duckdb/build/release -j2
      - name: Test real DuckHTS dependency, SQL functions and multi-chunk execution
        run: |
          python3 test/run_sql.py --duckdb .deps/duckdb/build/release/duckdb --extension artifacts/build/ducksassy.duckdb_extension
