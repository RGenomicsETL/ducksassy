name: C API hosts and Rust C library
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sdk_revision: ${{ steps.sdk.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32-unknown-emscripten
      - name: Fetch pinned v2 SDK
        id: sdk
        run: |
          make sdk
          echo "revision=$(python3 -c 'import json; print(json.load(open("ducksassy-package.json"))["duckdb_sdk_revision"])')" >> "$GITHUB_OUTPUT"
      - name: Architecture checks
        run: python3 test/check_contract.py
      - name: Configure bundled Rust dependencies
        run: make configure
      - name: Type-check the wasm128 backend
        env:
          CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUSTFLAGS: -C target-feature=+simd128
        run: >-
          cargo --config build/rust-vendor.toml check --frozen --manifest-path rust/Cargo.toml
          --target wasm32-unknown-emscripten --no-default-features
          --features backend-wasm128
      - name: Build C adapter and run the real C ABI test
        run: make test
      - name: Check loadable entrypoint and absence of DuckDB linkage
        shell: bash
        run: |
          nm -D build/ducksassy.so | grep ' T ducksassy_init_c_api_v2$'
          if nm -D --undefined-only build/ducksassy.so | grep -E ' U duckdb_'; then exit 1; fi
          if ldd build/ducksassy.so | grep -i duckdb; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ducksassy-linux-amd64
          path: |
            build/ducksassy.duckdb_extension
            build/libsassy_c.a
            include/sassy_c.h
            rust/Cargo.lock
            sql/ducksassy.sql
  released-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Stage released stable v1 SDK and CLI
        run: |
          make sdk-v1
          version=$(jq -r .v1_host.duckdb_version ducksassy-package.json)
          curl -fL --retry 3 "https://github.com/duckdb/duckdb/releases/download/${version}/duckdb_cli-linux-amd64.zip" -o .deps-v1/cli.zip
          unzip .deps-v1/cli.zip -d .deps-v1/cli
          .deps-v1/cli/duckdb --version
      - name: Build stable v1 adapter and test native ABI
        run: |
          make release-v1
          ctest --test-dir build-v1 --output-on-failure
          nm -D build-v1/ducksassy.so | grep ' T ducksassy_init_c_api$'
          if nm -D --undefined-only build-v1/ducksassy.so | grep -E ' U duckdb_'; then exit 1; fi
          if ldd build-v1/ducksassy.so | grep -i duckdb; then exit 1; fi
      - name: Stage checksum-pinned DuckHTS and test offline SQL
        run: |
          python3 tools/stage_runtime.py duckhts
          make sql-test-v1
      - uses: actions/upload-artifact@v4
        with:
          name: ducksassy-v1-linux-amd64
          path: build-v1/ducksassy.duckdb_extension
  sql-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ducksassy-linux-amd64
          path: artifacts
      - name: Stage checksum-pinned DuckHTS
        run: python3 tools/stage_runtime.py duckhts
      - uses: actions/cache@v4
        id: host
        with:
          path: .deps/duckdb-build/duckdb
          key: duckdb-ubuntu24.04-${{ runner.arch }}-${{ needs.build.outputs.sdk_revision }}-release-json-parquet-v1
      - name: Stage matching v2-preview DuckDB host
        run: python3 tools/stage_runtime.py duckdb --jobs 2
      - name: Test real DuckHTS dependency, SQL functions and multi-chunk execution
        run: |
          python3 test/run_sql.py --extension artifacts/build/ducksassy.duckdb_extension
