name: R CMD check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      MAKEFLAGS: -j2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Install the Rust GNU target for Rtools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            rustup target add aarch64-pc-windows-gnullvm
          else
            rustup target add x86_64-pc-windows-gnu
          fi
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/Rducksassy
          extra-packages: any::rcmdcheck
          needs: check
      - name: Verify staged package sources
        shell: bash
        run: make r-bootstrap-check
      - name: Build source tarball
        shell: bash
        run: |
          make r-package
          mkdir -p build/r-check-src
          tar -xzf Rducksassy_*.tar.gz -C build/r-check-src
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: build/r-check-src/Rducksassy
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"warning"'
