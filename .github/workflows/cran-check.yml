name: R CMD check (v2 preview)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    # The first run compiles the pinned duckdb.2.0.dev from source.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # OS_type: unix; CMake has no Windows archive/link implementation.
        os: [ubuntu-latest, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Search tests must run against the pinned host, not skip.
      RDUCKSASSY_REQUIRE_HOST: 'true'
      MAKEFLAGS: -j4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          # pak ignores DESCRIPTION Additional_repositories.
          extra-repositories: https://duckdb.r-universe.dev https://rgenomicsetl.r-universe.dev
      - name: Bootstrap package sources and reject drift from committed copies
        run: make r-bootstrap-check
      # r-universe only serves the newest preview build, whose C API v2 function
      # table can differ from the bundled headers (loading it segfaults). Install
      # the pinned duckdb-r revision instead; the dependency cache keys on it.
      - name: Read the pinned preview host
        id: host
        run: echo "revision=$(jq -r .r_integration_host.revision ducksassy-package.json)" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/Rducksassy
          extra-packages: |
            any::rcmdcheck
            any::jsonlite
            github::duckdb/duckdb-r@${{ steps.host.outputs.revision }}
            any::Rduckhts
          needs: check
      - name: Build source tarball and unpack check input
        shell: bash
        run: |
          make r-package
          mkdir -p build/r-check-src
          tar -xzf Rducksassy_*.tar.gz -C build/r-check-src
      - name: Require preview runtime dependencies
        shell: Rscript {0}
        run: |
          stopifnot(requireNamespace("duckdb.2.0.dev", quietly = TRUE))
          stopifnot(nzchar(system.file("duckhts_extension/build/duckhts.duckdb_extension", package = "Rduckhts")))
      # The action accepts a directory, not a tarball. Check exactly the unpacked
      # archive contents, including vendored sources, rather than the raw package.
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: build/r-check-src/Rducksassy
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"warning"'
      - name: DBI integration with the pinned preview engine
        if: runner.os == 'Linux'
        shell: bash
        run: |
          DUCKHTS_EXTENSION=$(Rscript -e 'cat(system.file("duckhts_extension/build/duckhts.duckdb_extension", package="Rduckhts", mustWork=TRUE))')
          export DUCKHTS_EXTENSION
          make r-test R_RUN=Rscript
